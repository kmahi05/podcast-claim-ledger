[project]
name = "podcast-ledger-api"
version = "0.1.0"
description = "Podcast Claim Ledger API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
